name: Reusable Python CI

on:
  workflow_call:
    inputs:
      python-version:
        type: string
        default: "3.12"
      working-directory:
        type: string
        default: "."
      install-command:
        type: string
        default: python -m pip install --upgrade pip
      check-command:
        type: string
        default: python -m compileall .

permissions:
  contents: read

jobs:
  ci:
    name: Python CI
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ inputs.working-directory }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ inputs.python-version }}
      - name: Install dependencies
        run: ${{ inputs.install-command }}
      - name: Run checks
        run: ${{ inputs.check-command }}
